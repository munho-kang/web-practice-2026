<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>강문호| 포트폴리오 & 문의하기</title>
  <meta name="description" content="강문호의 개인 포트폴리오 페이지입니다. 프로젝트 소개와 문의하기 기능을 제공합니다.">

  <meta property="og:title" content="강문호 | 포트폴리오 & 문의하기">
  <meta property="og:description" content="강문호의 개인 포트폴리오 페이지입니다. 프로젝트 소개와 문의하기 기능을 제공합니다.">
  <meta property="og:url" content="/Users/munhokang/82107/3-2/기초웹개발론/week3/image.png">
</head>
<body>

  <header>
    <h1>강문호</h1>
    <img src="image.png" alt="강문호의 프로필 사진">
  </header>

  <main>
    <section>
      <h2>소개</h2>
      <p>안녕하세요, 웹 개발을 공부하고 있는 강문호입니다. 시맨틱 태그와 웹 접근성을 고려한 페이지를 만드는 것을 목표로 하고 있습니다.</p>
    </section>

    <section>
      <h2>문의하기</h2>
      <form action="#" method="post">
        <p>
          <label for="name">이름</label><br>
          <input type="text" id="name" name="name" required>
        </p>

        <p>
          <label for="email">이메일</label><br>
          <input type="email" id="email" name="email" required>
        </p>

        <p>
          <label for="inquiry-type">문의유형</label><br>
          <select id="inquiry-type" name="inquiry-type">
            <option value="general">일반 문의</option>
            <option value="project">프로젝트 제안</option>
            <option value="bug">오류 신고</option>
            <option value="etc">기타</option>
          </select>
        </p>

        <p>
          <label for="message">문의내용</label><br>
          <textarea id="message" name="message" rows="6" required></textarea>
        </p>

        <p>
          <button type="submit">보내기</button>
        </p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 강문호. All rights reserved.</p>
    <p>Email: <a href="mailto:contact@example.com">contact@example.com</a></p>
  </footer>

</body>
</html>

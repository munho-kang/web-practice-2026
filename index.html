<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>강문호 Mini HTML이력서</title>
</head>
<body>
  <h1>강문호 Mini HTML이력서</h1>

  <h2>자기소개</h2>
  <p>
    안녕하세요, <b>웹 개발자를 꿈꾸는 강문호</b>입니다.<br>
    <i>새로운 기술을 배우는 것을 좋아하며</i>, 사용자에게 도움이 되는 서비스를 만들고 싶습니다.<br>
    <b>꾸준함</b>과 <i>호기심</i>을 무기로 성장하고 있습니다.
  </p>

  <h2>배우고 싶은 기술 스택</h2>
  <ul>
    <li>java</li>
    <li>python</li>
    <li>claude code</li>
  </ul>

  <h2>학력 및 경력</h2>
  <table border="1">
    <tr>
      <th>구분</th>
      <th>기간</th>
      <th>내용</th>
    </tr>
    <tr>
      <td>학력</td>
      <td>2022.03 ~ 현재</td>
      <td>제주대학교 컴퓨터공학과 재학</td>
    </tr>
    <tr>
      <td>학력</td>
      <td>2019.03 ~ 2022.02</td>
      <td>대기고등학교 졸업</td>
    </tr>

  </table>
</body>
</html>
